name: Image Build & Push
on: [push]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Update
        run: sudo apt-get update

      - name: Clone rpi-image-gen
        run: git clone --depth 1 https://github.com/raspberrypi/rpi-image-gen.git

      - name: Install dependencies
        working-directory: rpi-image-gen
        run: sudo ./install_deps.sh

      - name: Build image
        working-directory: rpi-image-gen
        run: ./rpi-image-gen build -c ./config/trixie-minbase.yaml

      - name: Collect release files
        run: |
          mkdir release
          cp rpi-image-gen/work/deploy-*/* release/
          cd release
          zstd -d --rm *.sbom.zst
          sha256sum * > SHA256SUMS
          
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
